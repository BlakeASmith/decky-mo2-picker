name: Prepare public release branch

# Internal only — excluded from release/public mirror. Run when you are ready to update GitHub.

on:
  workflow_dispatch:
    inputs:
      push_release_branch:
        description: Push release/public to Origin after commit
        type: boolean
        default: true
      mirror_to_public_github:
        description: Push release/public → BlakeASmith/decky-mo2-picker main
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build release/public from main
        id: build
        env:
          PUSH: ${{ inputs.push_release_branch == true && '1' || '0' }}
          PUSH_PUBLIC: "0"
        run: |
          chmod +x scripts/publish-public-branch.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          set +e
          OUT="$(PUSH="$PUSH" PUSH_PUBLIC=0 REMOTE=origin ./scripts/publish-public-branch.sh 2>&1)"
          CODE=$?
          set -e
          echo "$OUT"
          if [[ $CODE -ne 0 ]]; then
            exit "$CODE"
          fi
          if echo "$OUT" | grep -q "No public changes since last publish"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mirror to public GitHub
        if: inputs.mirror_to_public_github == true && steps.build.outputs.changed == 'true'
        env:
          PUBLIC_MIRROR_TOKEN: ${{ secrets.PUBLIC_MIRROR_TOKEN }}
          PUSH_PUBLIC: "1"
        run: |
          chmod +x scripts/publish-public-branch.sh
          if [[ -z "${PUBLIC_MIRROR_TOKEN}" ]]; then
            echo "::error::Add Origin repo secret PUBLIC_MIRROR_TOKEN — fine-grained PAT with Contents write on BlakeASmith/decky-mo2-picker (see docs/agents/PUBLIC_REPOSITORY.md)."
            exit 1
          fi
          PUSH_PUBLIC_ONLY=1 PUBLIC_MIRROR_TOKEN="$PUBLIC_MIRROR_TOKEN" \
            ./scripts/publish-public-branch.sh