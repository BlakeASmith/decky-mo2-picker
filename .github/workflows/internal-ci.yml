name: Internal CI (main)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pytest
      - run: pnpm install --frozen-lockfile && pnpm run build
      - run: pytest tests -q
        env:
          PYTHONPATH: ${{ github.workspace }}/py_modules