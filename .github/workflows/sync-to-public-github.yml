name: Sync to public GitHub

# Runs on private Origin when release/public is updated. Pushes that tree to GitHub main.

on:
  push:
    branches: [release/public]
  workflow_dispatch:

concurrency:
  group: sync-public-github
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/public
          fetch-depth: 0

      - name: Push to BlakeASmith/decky-mo2-picker (main)
        env:
          PUBLIC_GITHUB_PUSH_TOKEN: ${{ secrets.PUBLIC_GITHUB_PUSH_TOKEN }}
        run: |
          if [ -z "$PUBLIC_GITHUB_PUSH_TOKEN" ]; then
            echo "::error::Add secret PUBLIC_GITHUB_PUSH_TOKEN on Origin (contents:write on public repo)."
            exit 1
          fi
          git remote add public "https://x-access-token:${PUBLIC_GITHUB_PUSH_TOKEN}@github.com/BlakeASmith/decky-mo2-picker.git"
          git push public HEAD:refs/heads/main --force-with-lease